[project]
name = "hyperliquid-ohlc"
version = "0.1.0"
description = "Real-time OHLC parser for Hyperliquid using WebSocket streams"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hl-ohlc = "hyperliquid_ohlc.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hyperliquid_ohlc*"]
